[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "bb84-seminar"
version = "0.1.0"
description = "Development environment for the NPMP BB84 seminar"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "qiskit>=2,<3",
    "qiskit-aer>=0.18.2,<0.19",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "setuptools>=77,<83", "wheel>=0.45,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
norecursedirs = [".venv", ".direnv", ".cache", "literature"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
